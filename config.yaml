# MedSaarthi AI configuration. Model choices and reasons: docs/MODEL_CHOICES.md

safety:
  confidence_threshold: 0.80
  disclaimer: "Not medical advice. Confirm with your pharmacist or doctor."
  data_delimiter_open: "<<<PRESCRIPTION_DATA>>>"
  data_delimiter_close: "<<<END_PRESCRIPTION_DATA>>>"

llm:
  backend: groq            # groq | local
  model: openai/gpt-oss-20b          # default + evaluation (open weights, Apache-2.0)
  alt_models: [openai/gpt-oss-120b, qwen/qwen3.8-27b]
  reasoning_effort: low               # gpt-oss/qwen reasoning kept short and hidden
  local_model: Qwen/Qwen2.5-1.5B-Instruct
  temperature: 0
  max_tokens: 1024

ocr:
  printed: easyocr
  handwriting: microsoft/trocr-base-handwritten
  languages: [en]

translation:
  model: facebook/nllb-200-distilled-600M          # local fallback (CC-BY-NC), CPU
  alt_model: ai4bharat/indictrans2-en-indic-1B     # gated (accept terms on Hugging Face), MIT
  # Used only for text with no template. Tried in this order; a provider with no key is skipped.
  providers: [sarvam, groq, nllb]
  groq_model: openai/gpt-oss-120b
  sarvam_model: "sarvam-translate:v1"              # or "mayura:v1" (11 languages, 1,000 characters)
  timeout_s: 20

rag:
  embedding_model: BAAI/bge-m3
  chunk_size: 2900
  chunk_overlap: 2100
  top_k: 2
  query: "How should I use this medicine?"

schedule:
  wake_time: "06:00"
  sleep_time: "22:00"
  time_format: 24h        # 24h | 12h

audit:
  path: logs/audit.jsonl
